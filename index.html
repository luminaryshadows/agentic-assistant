<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Agentic Assistant</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --surface-2: #111111;
    --text-hi: #ededed;
    --text-mid: #a1a1a1;
    --text-low: #707070;
    --border: #262626;
    --border-bright: #333333;
    --blue: #0070f3;
    --blue-dim: rgba(0, 112, 243, 0.12);
    --green: #3fb950;
    --red: #f87171;
    --font-sans: "Geist", "Geist Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
  ::selection { background: var(--blue); color: #fff; }

  html { scrollbar-color: #333 transparent; }
  body {
    background: var(--bg);
    color: var(--text-hi);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  :focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ===== Nav ===== */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 14px 32px;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 16px; height: 16px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-title {
    font-size: 14px; font-weight: 600;
    letter-spacing: -0.01em;
    font-family: var(--font-mono);
  }
  .nav-ver {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--text-low);
    border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px;
  }
  .nav-spacer { flex: 1; }
  .nav-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-mid);
    font-family: var(--font-mono);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.15);
  }

  /* ===== Layout ===== */
  main {
    max-width: 1120px; margin: 0 auto;
    padding: 48px 24px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding-top: 32px; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color 0.15s ease;
  }
  .card:hover { border-color: var(--border-bright); }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .card-title {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-mid);
    font-family: var(--font-mono);
  }
  .card-badge {
    font-size: 11px; color: var(--text-low);
    font-family: var(--font-mono);
    white-space: nowrap;
  }

  /* ===== Deadlines ===== */
  .deadline-list { max-height: 340px; overflow-y: auto; }
  .deadline-item {
    display: flex; align-items: center; gap: 16px;
    padding: 13px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    transition: background 0.15s ease;
  }
  .deadline-item:last-child { border-bottom: none; }
  .deadline-item:hover { background: var(--surface-2); }
  .dl-date {
    min-width: 52px; text-align: center;
    font-family: var(--font-mono);
    line-height: 1.2;
  }
  .dl-date .day { font-size: 17px; font-weight: 600; color: var(--text-hi); letter-spacing: -0.02em; }
  .dl-date .mon { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-low); margin-top: 2px; }
  .dl-info { flex: 1; min-width: 0; }
  .dl-name { font-size: 14px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl-sub { font-size: 12px; color: var(--text-low); margin-top: 3px; font-family: var(--font-mono); }
  .urgent-dot {
    display: inline-block; width: 5px; height: 5px;
    border-radius: 50%; background: var(--red);
    margin-right: 7px; vertical-align: 2px;
    animation: pulse 2s infinite;
  }
  .urgent .dl-sub { color: var(--red); }
  .tag {
    font-size: 10px; font-weight: 500;
    font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 3px 9px; border-radius: 4px;
    border: 1px solid;
    flex: none;
  }
  .tag.summative { color: var(--text-hi); border-color: #454545; }
  .tag.formative { color: var(--text-mid); border-color: #383838; }
  .tag.task      { color: var(--text-low); border-color: #2e2e2e; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* ===== Chat ===== */
  .chat-messages {
    height: 300px; overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 82%; font-size: 14px; line-height: 1.55; letter-spacing: -0.006em; }
  .msg.user {
    align-self: flex-end;
    background: var(--surface-2);
    border: 1px solid var(--border-bright);
    color: var(--text-hi);
    padding: 10px 14px;
    border-radius: 8px;
    border-bottom-right-radius: 2px;
  }
  .msg.agent {
    align-self: flex-start;
    color: var(--text-mid);
    padding-left: 22px;
    position: relative;
  }
  .msg.agent::before {
    content: ">"; position: absolute; left: 0; top: 1px;
    font-family: var(--font-mono); font-size: 13px;
    color: var(--text-low);
  }
  .msg.typing::after {
    content: "...";
    font-family: var(--font-mono);
    animation: blink 1.2s steps(4) infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }
  .chat-input-row {
    display: flex; gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }
  .chat-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text-hi);
    transition: border-color 0.15s ease;
    caret-color: var(--blue);
    min-width: 0;
  }
  .chat-input::placeholder { color: var(--text-low); }
  .chat-input:hover { border-color: var(--border-bright); }
  .chat-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-dim); }
  .send-btn {
    width: 40px; height: 40px; flex: none;
    border-radius: 6px;
    background: var(--blue);
    color: #ffffff;
    border: none; cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .send-btn:hover { filter: brightness(1.15); }
  .send-btn:active { transform: scale(0.95); }

  /* ===== Subjects ===== */
  .subject-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; padding: 18px 20px 20px;
  }
  @media (max-width: 600px) { .subject-grid { grid-template-columns: repeat(2, 1fr); } }
  .subj {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 10px 12px;
    cursor: pointer;
    text-align: left;
    color: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .subj:hover { border-color: var(--border-bright); background: var(--surface-2); }
  .subj.active { border-color: var(--blue); background: var(--blue-dim); }
  .subj-idx {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--text-low); letter-spacing: 0.06em;
  }
  .subj.active .subj-idx { color: var(--blue); }
  .subj-name {
    font-size: 13px; font-weight: 500;
    margin-top: 6px; letter-spacing: -0.01em;
    color: var(--text-hi);
  }

  /* ===== Study plan / stats ===== */
  .stats-row {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .stat {
    flex: 1; padding: 16px 20px;
    text-align: left;
  }
  .stat + .stat { border-left: 1px solid var(--border); }
  .stat-num {
    font-family: var(--font-mono);
    font-size: 24px; font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-size: 10px; color: var(--text-low);
    text-transform: uppercase; letter-spacing: 0.08em;
    font-family: var(--font-mono);
    margin-top: 4px;
  }
  .progress-track {
    height: 2px; background: var(--surface-2);
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--blue);
    transition: width 0.3s ease;
  }
  .plan-list { padding: 8px 20px 20px; display: flex; flex-direction: column; }
  .plan-item {
    display: flex; align-items: flex-start; gap: 12px;
    font-size: 13px; letter-spacing: -0.006em; line-height: 1.5;
    color: var(--text-mid);
    padding: 8px 0;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    transition: color 0.15s ease;
  }
  .plan-item:last-child { border-bottom: none; }
  .plan-item:hover { color: var(--text-hi); }
  .plan-check {
    width: 16px; height: 16px; min-width: 16px;
    border-radius: 4px;
    border: 1px solid var(--border-bright);
    margin-top: 2px;
    position: relative;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .plan-item:hover .plan-check { border-color: var(--text-low); }
  .plan-item.done .plan-check {
    background: var(--blue);
    border-color: var(--blue);
  }
  .plan-item.done .plan-check::after {
    content: ""; position: absolute; left: 4px; top: 1px;
    width: 5px; height: 9px;
    border: solid #fff; border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }
  .plan-item.done span { text-decoration: line-through; opacity: 0.45; }

  footer {
    text-align: center; padding: 32px 20px 40px;
    font-size: 11px; color: var(--text-low);
    font-family: var(--font-mono);
    border-top: 1px solid var(--border);
    margin-top: 28px;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .urgent-dot { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<nav>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1.5" y="1.5" width="13" height="13" rx="2.5" stroke="#ededed" stroke-width="1.5"/>
        <path d="M5 10L8 5.5L11 10" stroke="#0070f3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="nav-title">agentic-assistant</span>
    <span class="nav-ver">v2.0</span>
  </div>
  <div class="nav-spacer"></div>
  <div class="nav-status"><span class="status-dot"></span> hermes online</div>
</nav>

<main>
  <!-- DEADLINES -->
  <section class="card">
    <div class="card-header">
      <div class="card-title">Upcoming deadlines</div>
      <div class="card-badge">managebac · live</div>
    </div>
    <div class="deadline-list" id="deadlines"></div>
  </section>

  <!-- CHAT -->
  <section class="card">
    <div class="card-header">
      <div class="card-title">Ask your assistant</div>
      <div class="card-badge" id="active-subject">All subjects</div>
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input-row">
      <input class="chat-input" id="chat-input" placeholder="Ask about homework, plan your study session…" autocomplete="off">
      <button class="send-btn" id="send-btn" aria-label="Send message">↑</button>
    </div>
  </section>

  <!-- SUBJECTS -->
  <section class="card">
    <div class="card-header">
      <div class="card-title">Subjects</div>
      <div class="card-badge">tap to focus chat</div>
    </div>
    <div class="subject-grid" id="subjects"></div>
  </section>

  <!-- STUDY PLAN -->
  <section class="card">
    <div class="card-header">
      <div class="card-title">Today's study plan</div>
      <div class="card-badge" id="plan-progress">0/5 done</div>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="stat-deadlines">–</div><div class="stat-label">Deadlines</div></div>
      <div class="stat"><div class="stat-num" id="stat-week">–</div><div class="stat-label">This week</div></div>
      <div class="stat"><div class="stat-num" id="stat-done">0%</div><div class="stat-label">Progress</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="plan-bar"></div></div>
    <div class="plan-list" id="plan"></div>
  </section>
</main>

<footer>hermes orchestrator · codex-built · notion-backed (coming)</footer>

<script>
// ============ DATA (mock — will be replaced by Notion API + Google Calendar) ============
const SUBJECTS = [
  { icon: "📐", name: "Math",       key: "math" },
  { icon: "⚡", name: "Physics",    key: "physics" },
  { icon: "🧪", name: "Chemistry",  key: "chemistry" },
  { icon: "🀄", name: "Chinese",    key: "chinese" },
  { icon: "📖", name: "English",    key: "english" },
  { icon: "🌍", name: "Geography",  key: "geography" },
  { icon: "🎨", name: "Design",     key: "design" },
  { icon: "🤖", name: "AI Project", key: "ai" },
];

// Deadlines are LIVE from ManageBac via the backend (/api/deadlines)
const DEADLINES = []; // populated async

async function loadDeadlines() {
  try {
    const r = await fetch(`${API_BASE}/api/deadlines`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    DEADLINES.length = 0;
    for (const d of data.deadlines) {
      DEADLINES.push({ date: new Date(d.start), name: d.name, sub: d.description || "ManageBac", type: "task" });
    }
  } catch (err) {
    DEADLINES.push({ date: new Date(), name: "Could not load deadlines", sub: "backend offline?", type: "formative" });
  }
  renderDeadlines();
}

const STUDY_PLAN = [
  "Review arithmetic sequences rules (uₙ formula)",
  "Finish 5 practice problems on geometric sequences",
  "Draft English reading response outline",
  "Pre-read Chemistry lab procedure",
  "Log today's mistakes + fixes in reflection",
];

let activeSubject = null;

// ============ RENDER ============
function renderDeadlines() {
  const el = document.getElementById("deadlines");
  const now = new Date();
  const sorted = [...DEADLINES].sort((a,b) => a.date - b.date);
  el.innerHTML = sorted.map(d => {
    const daysLeft = Math.ceil((d.date - now) / 86400000);
    const urgent = daysLeft <= 3 ? "urgent" : "";
    const dot = daysLeft <= 3 ? `<span class="urgent-dot"></span>` : "";
    return `<div class="deadline-item ${urgent}">
      <div class="dl-date"><div class="day">${d.date.getDate()}</div><div class="mon">${d.date.toLocaleString('en',{month:'short'})}</div></div>
      <div class="dl-info">
        <div class="dl-name">${d.name}</div>
        <div class="dl-sub">${dot}${d.sub} · ${daysLeft <= 0 ? "TODAY" : `in ${daysLeft} day${daysLeft>1?"s":""}`}</div>
      </div>
      <span class="tag ${d.type}">${d.type}</span>
    </div>`;
  }).join("");

  const week = sorted.filter(d => (d.date - now)/86400000 <= 7).length;
  document.getElementById("stat-deadlines").textContent = sorted.length;
  document.getElementById("stat-week").textContent = week;
}

function renderSubjects() {
  document.getElementById("subjects").innerHTML = SUBJECTS.map((s,i) =>
    `<button type="button" class="subj ${activeSubject === s.key ? "active" : ""}" onclick="pickSubject('${s.key}','${s.name}')">
      <div class="subj-idx">${String(i+1).padStart(2,"0")}</div>
      <div class="subj-name">${s.name}</div>
    </button>`).join("");
}

function pickSubject(key, name) {
  activeSubject = activeSubject === key ? null : key;
  renderSubjects();
  document.getElementById("active-subject").textContent = activeSubject ? name : "All subjects";
}

function renderPlan() {
  const saved = JSON.parse(localStorage.getItem("aa-plan") || "[]");
  document.getElementById("plan").innerHTML = STUDY_PLAN.map((t,i) =>
    `<div class="plan-item ${saved.includes(i)?"done":""}" onclick="togglePlan(${i})">
      <div class="plan-check"></div><span>${t}</span>
    </div>`).join("");
  const pct = Math.round(saved.length/STUDY_PLAN.length*100);
  document.getElementById("plan-progress").textContent = `${saved.length}/${STUDY_PLAN.length} done`;
  document.getElementById("stat-done").textContent = pct + "%";
  document.getElementById("plan-bar").style.width = pct + "%";
}

function togglePlan(i) {
  let saved = JSON.parse(localStorage.getItem("aa-plan") || "[]");
  saved = saved.includes(i) ? saved.filter(x=>x!==i) : [...saved, i];
  localStorage.setItem("aa-plan", JSON.stringify(saved));
  renderPlan();
}

// ============ CHAT (real backend + fallback) ============
const API_BASE = window.location.origin.startsWith("http") && window.location.port !== ""
  ? window.location.origin
  : "http://localhost:9092";

const FALLBACK_REPLIES = [
  "Backend offline — I'm in demo mode. Start the FastAPI server (python3 backend.py) and I'll answer for real via OpenRouter.",
  "Still demo mode. The full build routes this to a subject-tutor agent via Hermes.",
  "Demo reply. Wire up the backend and this becomes a real LLM answer.",
];

async function askBackend(message, subject, history) {
  const r = await fetch(`${API_BASE}/api/chat`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message, subject, history }),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  if (!data.reply) throw new Error("no reply field");
  return data.reply;
}

function addMsg(text, who, typing=false) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `msg ${who}${typing?" typing":""}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

document.getElementById("send-btn").onclick = sendChat;
document.getElementById("chat-input").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

let replyIdx = 0;
let sending = false;
async function sendChat() {
  if (sending) return;
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;
  sending = true;
  addMsg(text, "user");
  input.value = "";
  const t = addMsg("Thinking", "agent", true);

  // short history from DOM (last few turns)
  const hist = [...document.querySelectorAll("#messages .msg:not(.typing)")]
    .slice(-7, -1)
    .map(el => ({
      role: el.classList.contains("user") ? "user" : "assistant",
      content: el.textContent,
    }));

  const subj = SUBJECTS.find(s => s.key === activeSubject);
  try {
    const reply = await askBackend(text, subj ? subj.name : null, hist);
    t.classList.remove("typing");
    t.textContent = reply;
  } catch (err) {
    t.classList.remove("typing");
    t.textContent = `${subj ? "[" + subj.name + "] " : ""}${FALLBACK_REPLIES[replyIdx++ % FALLBACK_REPLIES.length]}`;
  } finally {
    sending = false;
    const box2 = document.getElementById("messages");
    box2.scrollTop = box2.scrollHeight;
  }
}

// ============ INIT ============
renderSubjects();
renderPlan();
loadDeadlines();
addMsg("Hey Aaden — Agentic Assistant is live with a real LLM backend. Pick a subject, check your deadlines, or ask me anything.", "agent");
</script>
</body>
</html>
